name: delta 

on:
  workflow_dispatch:
    inputs:
      max_dispatch:
        description: "Max builds to dispatch in this run"
        default: "64"

permissions:
  contents: read

env:
  TARGET_REPO: 11notes/alpine-python-wheels
  TARGET_WORKFLOW: update.yml
  TARGET_REF: main
  MAX_DISPATCH: ${{ inputs.max_dispatch || '64' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.audit.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: audit wheels
        id: audit
        run: |
          pip install packaging
          python delta.py --python 3.15 3.14 --json --skip-pure > missing.json
          echo "count=$(jq length missing.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: missing
          path: missing.json

  dispatch:
    needs: audit
    if: needs.audit.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: missing

      - name: build missing wheels
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: |
          total=$(jq length missing.json)
          echo "### Missing wheels: $total (dispatching up to $MAX_DISPATCH)" >> "$GITHUB_STEP_SUMMARY"

          while read -r row; do
            project=$(jq -r .project <<<"$row")
            version=$(jq -r .version <<<"$row")
            python=$(jq -r .python <<<"$row")
            arch=$(jq -r .arch <<<"$row")

            echo "dispatching $project $version python=$python arch=$arch"
            gh workflow run "$TARGET_WORKFLOW" \
              -R "$TARGET_REPO" --ref "$TARGET_REF" \
              -f wheel="$project" \
              -f version="$version" \
              -f python="$python" \
              -f platform="$arch" \
              -f force="true" < /dev/null

            echo "- $project $version (python $python, $arch)" >> "$GITHUB_STEP_SUMMARY"
            sleep 5
          done < <(jq -c ".[:$MAX_DISPATCH][]" missing.json)