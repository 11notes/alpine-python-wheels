name: epaper-dithering
run-name: epaper-dithering ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "set semver for build"
        type: string
        required: false
        default: "null"
  schedule:
    - cron: "28 8 * * *"

jobs:
  epaper-dithering:
    runs-on: ubuntu-latest

    steps:
      - name: udpate / get latest version
        run: |
          if [ "${{ github.event.inputs.version }}" != "null" ] && [ "${{ github.event.inputs.version }}" != "" ]; then
            LATEST="${{ github.event.inputs.version }}"
          else
            LATEST="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/OpenDisplay/epaper-dithering/releases?per_page=100" \
              | jq -r --arg prefix "epaper-dithering-v" '
                  first(.[] | select(
                    .prerelease == false and .draft == false
                    and (.tag_name | startswith($PREFIX))
                    and (.tag_name | test("[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))
                  ))
                  | .tag_name
                  | capture("(?<major>[0-9]+)\\.(?<minor>[0-9]+)(?:\\.(?<patch>[0-9]+))?$")
                  | "\(.major).\(.minor).\(.patch // "0")"')"
          fi

          if [ -z "${LATEST}" ]; then
            echo "no latest version found" >&2
            exit 1
          fi

          echo "LATEST=${LATEST}" >> "${GITHUB_ENV}"

      - name: udpate / call update workflow
        if: env.LATEST != 'null' && env.LATEST != ''
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          wait-for-completion: false
          workflow: update.yml
          token: "${{ secrets.REPOSITORY_TOKEN }}"
          inputs: '{ "wheel":"epaper-dithering", "version":"${{ env.LATEST }}" }'